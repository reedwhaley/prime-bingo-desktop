[package]
name = "prime-bingo-desktop"
version = "0.2.0"
description = "Prime Bingo desktop client"
authors = ["Reed Whaley"]
edition = "2021"

[lib]
name = "prime_bingo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
